name: Verify disconnected installation
on:
  push:
    branches: [codex/verify-disconnected-toolkit-4.0.0]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Download the published ZIP before disconnecting
        run: python scripts/stage-offline-audit.py
      - name: Install the bundled desktop runtime in a disconnected guest
        run: ./scripts/test-local-runtime.ps1
